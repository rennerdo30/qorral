[package]
name = "qorral-fs"
description = "Qorral's shared-folder file server: virtio-fs (FUSE) requests answered from host folders"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Own workspace: the file server is a leaf with its own dependency set, kept
# out of the app and CLI builds. It ships as a DLL that QEMU loads.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fuse = { git = "https://github.com/microsoft/openvmm", rev = "e6b458cc032208448d16c529ef973f0cee7c23e1" }
lx = { git = "https://github.com/microsoft/openvmm", rev = "e6b458cc032208448d16c529ef973f0cee7c23e1" }
lxutil = { git = "https://github.com/microsoft/openvmm", rev = "e6b458cc032208448d16c529ef973f0cee7c23e1" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
opt-level = 3
debug = "line-tables-only"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
